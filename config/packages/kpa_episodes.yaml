# Themed episodes of Kid Pan Alley songs (src/Episode/, docs/themed-episodes.md).
# Synthetic hosts on Mistral (Voxtral) stock voices: no real person's voice is cloned.
# Voices modeled on Paul Reisler and Cheryl Toth wait for their explicit consent.
parameters:
    kpa.episodes:
        title: 'The Kid Pan Alley Songbook'
        hosts:
            paulbot:
                name: PaulBot
                persona: 'A synthetic host, the enthusiast of the duo: loves a big chorus and the moment a class hears its own song.'
                voices:
                    neutral: en_paul_neutral
                    excited: en_paul_excited
                    happy: en_paul_happy
                    confident: en_paul_confident
            cherylbot:
                name: CherylBot
                persona: 'A synthetic host, the curious one: asks where a line came from and reads the credits.'
                voices:
                    neutral: gb_jane_neutral
                    curious: gb_jane_curious
                    confident: gb_jane_confident
                    sarcasm: gb_jane_sarcasm
