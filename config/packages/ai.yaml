framework:
    http_client:
        scoped_clients:
            kpa.ollama.client:
                base_uri: '%env(KPA_OLLAMA_URL)%'
                timeout: 60
                max_duration: 90
ai:
    platform:
        mistral:
            api_key: '%env(MISTRAL_API_KEY)%'
        ollama:
            endpoint: '%env(KPA_OLLAMA_URL)%'
            http_client: 'kpa.ollama.client'
